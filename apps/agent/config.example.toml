# Copy to $XDG_CONFIG_HOME/manica/config.toml (~/.config/manica/config.toml),
# or pass --config-dir.

[plane]
# Where the plane is reachable.
url = "http://localhost:3000"
# The token shown when the agent was created in the plane. Can also be set
# with MANICA_AGENT_TOKEN. Keep this file readable only by you (chmod 600).
token = "mna_..."
# Seconds between polls for jobs (1 to 20).
# poll_interval = 5

[agent]
# Where runner builds are downloaded and runners run. Defaults to
# $XDG_DATA_HOME/manica (~/.local/share/manica).
# data_dir = "/var/lib/manica"

# Report this machine's CPU, memory and disk use (of the volume data_dir is
# on) to the plane, which charts it on the Agents page.
# [metrics]
# enabled = true
# Seconds between readings (15 to 600).
# interval = 30

# Run each job in a fresh macOS VM of its own, cloned from a stopped "golden"
# VM, and deleted afterwards, instead of on this machine as this user. Needs
# an Apple silicon Mac and the backend's CLI installed; macOS runs at most 2
# VMs at once, so give the agent at most 2 slots. Check the setup with
# `manica-agent doctor`.
# [vm]
# backend = "lima"
# image = "manica-golden"
