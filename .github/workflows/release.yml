name: release

# Runs on the GitHub releases release-please publishes. Versions are linked,
# so every release publishes a plane-vX.Y.Z and an agent-vX.Y.Z release; this
# workflow ships the plane, agent-release.yml ships the agent.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  plane:
    name: plane image
    if: startsWith(github.event.release.tag_name, 'plane-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - id: version
        run: echo "version=${TAG#plane-v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.release.tag_name }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/plane
          # latest=auto: prereleases don't move latest. No bare major tag
          # before 1.0, where every minor may break.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }},enable=${{ !startsWith(steps.version.outputs.version, '0.') }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      # The Dockerfile cross-compiles in a stage running on the runner's own
      # platform, so both architectures build here without emulation.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/plane/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=plane
          cache-to: type=gha,mode=max,scope=plane
