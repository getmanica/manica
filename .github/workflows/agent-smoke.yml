name: agent smoke build

on:
  push:
    branches: [main]
    paths:
      - apps/agent/**
      - apps/plane/**
      - packages/**
      - bun.lock
      - package.json
      - mise.toml
      - mise.lock
      - .github/workflows/agent-smoke.yml
  pull_request:
    paths:
      - apps/agent/**
      - apps/plane/**
      - packages/**
      - bun.lock
      - package.json
      - mise.toml
      - mise.lock
      - .github/workflows/agent-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: build (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The versions come from mise.toml.
      - uses: jdx/mise-action@v5
        with:
          install_args: bun rust zig github:rust-cross/cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/agent
      - run: bun install --frozen-lockfile
      - name: test
        working-directory: apps/agent
        run: |
          bun run lint
          bun run test
      # Both Linux builds, as they're released: static, through zig.
      - name: build
        working-directory: apps/agent
        run: bun scripts/compile.ts --os linux
      - name: smoke test
        working-directory: apps/agent/dist/release
        run: |
          ./manica-agent-linux-x64 --version
          ./manica-agent-linux-x64 --help

  macos:
    name: build (macos-arm64)
    # One of our own runners, picked up by a Manica agent through the plane.
    # They don't take pull requests from forks: that code would run on our
    # machines.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, manica, macos, arm64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The versions come from mise.toml.
      - uses: jdx/mise-action@v5
        with:
          install_args: bun rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/agent
      - run: bun install --frozen-lockfile
      - name: test
        working-directory: apps/agent
        run: bun run test
      - name: build
        working-directory: apps/agent
        run: bun run build
      - name: smoke test
        working-directory: apps/agent
        run: |
          ./dist/manica-agent --version
          ./dist/manica-agent --help
