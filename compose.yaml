services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: manica
      POSTGRES_PASSWORD: manica
      POSTGRES_DB: manica
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U manica -d manica']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
